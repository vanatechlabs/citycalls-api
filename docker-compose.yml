version: "3.9"

services:
  api:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/citycalls?replicaSet=citycalls-rs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "citycalls-rs", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { if (rs.status().myState !== 1) quit(1); } catch (e) { rs.initiate({_id:'citycalls-rs',members:[{_id:0,host:'mongo:27017'}]}); quit(1); }\""]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo-data:
